<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./images/logo_pointer.svg"
    />
    <script>
      // Apply theme immediately before any rendering
      (function () {
        const theme = localStorage.getItem('tick-it-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="./src/styles/main.css" />
    <link rel="stylesheet" href="./src/styles/impressum.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tick.it - Impressum</title>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img id="theme-logo" src="" alt="tick.it logo" class="header-logo" />
        <script>
          // Set initial logo based on theme immediately
          (function () {
            const theme =
              document.documentElement.getAttribute('data-theme') || 'light';
            const logoMap = {
              light: './src/images/logo_lightmode.svg',
              dark: './src/images/logo_darkmode.svg',
              'high-contrast': './src/images/logo_high_contrast.svg',
            };
            document.getElementById('theme-logo').src = logoMap[theme];
          })();
        </script>
      </div>
      <div class="theme-switcher">
        <button class="theme-btn" data-theme="light">Light</button>
        <button class="theme-btn" data-theme="dark">Dark</button>
        <button class="theme-btn" data-theme="high-contrast">
          High Contrast
        </button>
        <script>
          // Set active button immediately based on current theme
          (function () {
            const theme =
              document.documentElement.getAttribute('data-theme') || 'light';
            document.querySelectorAll('.theme-btn').forEach((btn) => {
              if (btn.getAttribute('data-theme') === theme) {
                btn.classList.add('active');
              }
            });
          })();
        </script>
      </div>
    </header>

    <div class="main">
      <h1>Legal Notice</h1>
      <div>Tara Dethlefsen & Philipp Wisser</div>
      <div class="italic">Optionales Projekt für Interaktive Systeme 2026</div>
    </div>

    <ul class="navigation">
      <li><a href="./index.html">Back to Board</a></li>
    </ul>

    <script type="module" src="./src/scripts/theme.ts"></script>
  </body>
</html>
