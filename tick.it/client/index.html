<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./src/styles/main.css" />
    <link rel="stylesheet" href="./src/styles/board.css" />
    <link rel="stylesheet" href="./src/styles/modal.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tick.it - Board</title>
  </head>
  <body>
    <header>
      <div>tick.it</div>
    </header>
    <div class="main">
      <button id="addcard" class="add-card-btn">Add Card</button>

      <div class="board">
        <!-- Lane 1 -->
        <div id="lane-backlog" class="lane">
          <h2>Backlog</h2>
        </div>
        <!-- Lane 2 -->
        <div id="lane-in-progress" class="lane">
          <h2>In Progress</h2>
        </div>
        <!-- Lane 3 -->
        <div id="lane-review" class="lane">
          <h2>Review</h2>
        </div>
        <!-- Lane 4 -->
        <div id="lane-done" class="lane">
          <h2>Done</h2>
        </div>
      </div>
      <div id="trash" class="trash">🗑️ Remove Card</div>
    </div>

    <!-- Modal Overlay -->
    <div id="card-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Neue Karte erstellen</h2>
          <button class="modal-close" id="close-modal">&times;</button>
        </div>
        <form id="card-form">
          <input type="hidden" id="card-id" name="id" />

          <div class="form-group">
            <label for="card-title">Titel *</label>
            <input
              type="text"
              id="card-title"
              name="title"
              required
              placeholder="z.B. Feature implementieren"
            />
          </div>

          <div class="form-group">
            <label for="card-description">Beschreibung</label>
            <textarea
              id="card-description"
              name="description"
              rows="4"
              placeholder="Detaillierte Beschreibung der Aufgabe..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="card-deadline">Deadline</label>
            <input type="date" id="card-deadline" name="deadline" />
          </div>

          <div class="modal-actions">
            <button
              type="button"
              class="btn-delete"
              id="delete-btn"
              style="display: none"
            >
              Löschen
            </button>
            <div class="modal-actions-right">
              <button type="button" class="btn-cancel" id="cancel-btn">
                Abbrechen
              </button>
              <button type="submit" class="btn-submit" id="submit-btn">
                Karte erstellen
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
  <script type="module" src="./src/scripts/board.ts"></script>
</html>
